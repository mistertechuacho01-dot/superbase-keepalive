name: Supabase Keep-Alive

# Corre todos los días a las 13:00 UTC (08:00 hora Perú) y también se puede
# lanzar a mano desde la pestaña "Actions" de GitHub con "Run workflow".
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

# Necesario para que el propio workflow pueda hacer un commit (ver último
# paso) y así GitHub nunca lo desactive por "60 días sin actividad en el
# repositorio" — sin esto, ese límite de GitHub terminaría apagando el
# propio ping que se supone debe evitar que Supabase se pause.
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping a Supabase (cuenta como actividad y evita la pausa por inactividad)
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/areas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Ping enviado correctamente."

      - name: Registrar la fecha del ping (mantiene vivo este mismo workflow)
        run: |
          mkdir -p .keepalive
          echo "Último ping: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .keepalive/last-ping.txt
          git config user.name "supabase-keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive/last-ping.txt
          git commit -m "chore: ping diario a Supabase" || echo "Sin cambios que registrar"
          git push
